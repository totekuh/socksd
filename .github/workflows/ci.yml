name: Build and Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Linux
        run: make

      - name: Build Debian package
        run: bash build-deb.sh ${{ github.ref_name }}

      - name: Cross-compile Windows x64
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
          make windows

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "socksd,deb/socksd_${{ github.ref_name }}.deb,socksd.exe"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          generateReleaseNotes: true
